services:
  - type: web
    name: shunkan
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # 無料Web ServiceではpreDeployCommandを使えないため、起動前に1回だけmigrationする。
    startCommand: python manage.py migrate --noinput && gunicorn shunkan_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shunkan-db
          property: connectionString
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # 外部ストレージ導入までは、消失する写真を本番で受け付けない。
      - key: ALLOW_PHOTO_UPLOADS
        value: "false"

databases:
  - name: shunkan-db
    region: singapore
    plan: free
