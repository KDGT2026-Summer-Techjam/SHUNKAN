{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}旬間 (SHUNKAN){% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/css/app.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'core/images/favicon.ico' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-shell">
    <a class="skip-link" href="#main-content">本文へ移動</a>
    {% block app_logo %}{% if user.is_authenticated %}<div class="app-logo"><a href="{% url 'rooms' %}" aria-label="旬間 (SHUNKAN) のRoom一覧へ"><img src="{% static 'core/images/shunkan-logo.png' %}" alt="旬間 (SHUNKAN)"></a></div>{% endif %}{% endblock %}
    <main id="main-content" class="screen {% block screen_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% block navigation %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
