{% load static %}
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8f4">
    <title>{% block title %}旬間 (SHUNKAN){% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/v8-ui.css' %}">
  </head>
  <body>
    <main class="shunkan">
      {% block content %}{% endblock %}
    </main>

    <nav class="site-nav" aria-label="メインメニュー">
      <a class="site-nav__link{% if request.resolver_match.url_name == 'home' %} is-current{% endif %}" href="{% url 'home' %}">ホーム</a>
      <a class="site-nav__link{% if request.resolver_match.url_name == 'moments_new' %} is-current{% endif %}" href="{% url 'moments_new' %}">今を残す</a>
      <a class="site-nav__link{% if request.resolver_match.url_name == 'tasks' %} is-current{% endif %}" href="{% url 'tasks' %}">タスク</a>
      <a class="site-nav__link{% if request.resolver_match.url_name == 'album' %} is-current{% endif %}" href="{% url 'album' %}">アルバム</a>
    </nav>
    {% block scripts %}{% endblock %}
  </body>
</html>
