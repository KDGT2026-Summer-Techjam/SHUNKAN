{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>新規登録 | 旬間 (SHUNKAN)</title>
  <link rel="stylesheet" href="{% static 'core/css/v8-ui.css' %}">
  <link rel="stylesheet" href="{% static 'core/css/shunkan-preview.css' %}">
</head>
<body>
  <div class="app-shell">
    <main class="screen screen--login">
      {% include "core/includes/auth_header.html" %}
      <section class="login-panel" aria-labelledby="signup-title">
        <div class="brand brand--compact"><div class="brand__jp">旬間<span>。</span></div><div class="brand__en">SHUNKAN</div></div>
        <h1 id="signup-title">新規登録</h1>
        <p>自分だけのRoomを作り、今の瞬間を残します。</p>
        <form class="form-stack" method="post">
          {% csrf_token %}
          {% if form.non_field_errors %}<div class="form-error form-error--block" role="alert">{{ form.non_field_errors }}</div>{% endif %}
          <label class="field" for="{{ form.username.id_for_label }}"><span class="field__label">ユーザー名</span>{{ form.username }}{% if form.username.errors %}<span class="form-error" role="alert">{{ form.username.errors|striptags }}</span>{% endif %}</label>
          <label class="field" for="{{ form.password1.id_for_label }}"><span class="field__label">パスワード</span>{{ form.password1 }}{% if form.password1.errors %}<span class="form-error" role="alert">{{ form.password1.errors|striptags }}</span>{% endif %}</label>
          <label class="field" for="{{ form.password2.id_for_label }}"><span class="field__label">パスワード（確認）</span>{{ form.password2 }}{% if form.password2.errors %}<span class="form-error" role="alert">{{ form.password2.errors|striptags }}</span>{% endif %}</label>
          <button class="primary-button" type="submit">登録してRoomを作る</button>
        </form>
        <p class="login-register">アカウントがある場合 <a href="{% url 'login' %}">ログインはこちら</a></p>
      </section>
    </main>
  </div>
</body>
</html>
